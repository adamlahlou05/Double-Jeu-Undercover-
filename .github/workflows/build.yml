# Tests, compilation de l'APK et essai sur émulateur.
# À chaque envoi sur main : l'APK est disponible dans les « Artifacts » de l'exécution.
# À chaque étiquette vX.Y.Z : l'APK est aussi publié dans une release GitHub.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests du jeu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bibliothèque de mots (doublons, longueurs)
        run: npm run check:words
      - name: Moteur de jeu et tirage des mots
        run: npm test
      - name: Parties complètes dans un navigateur
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  apk:
    name: Android (AAB pour le Play Store, APK pour essayer)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.DJ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DJ_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret DJ_KEYSTORE_BASE64 absent : fichiers signés avec une clé de débogage jetable. L'APK s'installe pour un essai, mais l'AAB sera refusé par le Play Store (voir GUIDE-PUBLICATION.md)."
          fi
      - name: Tests natifs, lint et compilation
        working-directory: android
        env:
          DJ_KEYSTORE_PASSWORD: ${{ secrets.DJ_KEYSTORE_PASSWORD }}
          DJ_KEY_ALIAS: ${{ secrets.DJ_KEY_ALIAS }}
          DJ_KEY_PASSWORD: ${{ secrets.DJ_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Nom du fichier
        id: name
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          cp android/app/build/outputs/apk/release/app-release.apk "double-jeu-$version.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "double-jeu-$version.aab"
          echo "file=double-jeu-$version.apk" >> "$GITHUB_OUTPUT"
          echo "bundle=double-jeu-$version.aab" >> "$GITHUB_OUTPUT"
          if grep -q '3940256099942544' android/monetization.properties; then
            echo "::warning::Identifiants AdMob de démonstration : cette version affiche des publicités de test. Renseigne android/monetization.properties avant de publier."
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.bundle }}
          if-no-files-found: error
      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.name.outputs.file }}" "${{ steps.name.outputs.bundle }}" --title "Double Jeu $GITHUB_REF_NAME" --generate-notes

  emulator:
    name: Essai de l'APK sur émulateur
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: android
          path: apk
      - name: Accélération matérielle (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/emulator-smoke.sh apk/*.apk
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: emulateur
          path: emulator-out/
